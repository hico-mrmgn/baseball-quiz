<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>先に動け — 依知のシーズン（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+JP:wght@500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#14213d; --muted:#5b6478; --paper:#f6f3ea; --card:#ffffff;
    --def:#1f8a4c; --off:#e8762b; --out:#f2b134; --run:#d92d20; --best:#2563eb;
    --line:#e6e1d3;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;font-weight:500}
  body{max-width:520px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .top{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 10px 4px}
  .bar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}
  .bar .t{font-weight:900;font-size:15px}
  .bar .s{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:1px;color:var(--muted)}
  svg.field{width:100%;display:block;border-radius:16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
  .board{font-family:"Bebas Neue",sans-serif}
  .panel{padding:8px 12px 24px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:900}
  .tag.def{background:var(--def);color:#fff}.tag.off{background:var(--off);color:#fff}
  .tag.src{background:#fff3c4;color:#7a5a00;border:1px solid #f0d77a}
  .sit{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:14px;font-weight:700;margin-top:8px}
  .sit .diff{font-family:"Bebas Neue",sans-serif;font-size:22px;letter-spacing:.5px}
  .note{font-size:14px;line-height:1.6;margin-top:6px;color:#333}
  .q{font-size:20px;font-weight:900;line-height:1.35;margin:4px 0}
  .q small{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:900;cursor:pointer;min-height:48px;flex:1 1 40%}
  .chip:active{transform:scale(.98)}
  .chip.sel{border-color:var(--best);background:#eaf1ff}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:900;color:#fff;background:linear-gradient(90deg,#f0792b,#e3342f);cursor:pointer;box-shadow:0 6px 14px rgba(227,52,47,.25)}
  .btn.blue{background:linear-gradient(90deg,#2563eb,#1d4ed8);box-shadow:0 6px 14px rgba(37,99,235,.25)}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:none}
  .btn:disabled{opacity:.4;box-shadow:none}
  .plan{display:flex;gap:8px;font-size:13px;font-weight:700;color:var(--muted)}
  .plan span{background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 10px}
  .plan span.on{color:var(--ink);border-color:var(--best)}
  .result{font-size:26px;font-weight:900;text-align:center;padding:8px 0 0}
  .result.best{color:#15803d}.result.ok{color:#0369a1}.result.poor{color:#b45309}.result.fatal{color:#b91c1c}
  .key{background:#14213d;color:#fff;border-radius:14px;padding:14px 16px;font-size:18px;font-weight:900;line-height:1.5;text-align:center}
  .key small{display:block;font-size:11px;opacity:.7;font-weight:700;margin-bottom:4px;letter-spacing:.1em}
  .why{font-size:14px;line-height:1.7}
  details summary{cursor:pointer;font-weight:900;color:var(--muted);font-size:14px}
  .log{display:flex;flex-direction:column;gap:6px}
  .log div{display:flex;gap:10px;align-items:center;font-size:14px;font-weight:700}
  .log b{font-family:"Bebas Neue",sans-serif;font-size:22px;width:28px;text-align:center}
  .big{font-family:"Bebas Neue",sans-serif;font-size:64px;line-height:1;text-align:center;letter-spacing:2px}
  .hint{font-size:12px;color:var(--muted);font-weight:700}
  @keyframes pulse{0%{r:7;opacity:.9}100%{r:13;opacity:0}}
  .tgt-ring{animation:pulse 1.1s ease-out infinite}
  .flash{position:fixed;inset:0;pointer-events:none;display:flex;align-items:center;justify-content:center;z-index:9}
  .flash span{font-family:"Bebas Neue",sans-serif;font-size:72px;color:#fff;letter-spacing:4px;text-shadow:0 4px 18px rgba(0,0,0,.5);opacity:0;transform:scale(.6)}
  .flash.show span{animation:pop .9s ease-out forwards}
  @keyframes pop{0%{opacity:0;transform:scale(.6)}25%{opacity:1;transform:scale(1.1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
</style>
</head>

       fb:{stay:'センターはそのまま。内野の打球はセカンドのカバーに備える。','backup-first':'センターから一塁の後ろは遠すぎる。',chase:'内野のボールは追わない。'}},
  outcomes:[{kind:'ball',play:'センター前へ落ちるヒット',area:'center',w:2},{kind:'not',play:'ショートゴロ',area:'short',w:1}],

/* ──────────────── 状態 ──────────────── */
const S={i:0,outs:0,runs:0,plan:{},log:[],phase:'intro',voice:null,anim:{}};
const field=document.getElementById('field'),panel=document.getElementById('panel');
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
function scene(){return SCENES[S.i]}

/* ──────────────── フィールド描画 ──────────────── */
function fielderPos(key,sit){const p=POS[key];const d=SHIFT[sit.defense]?.[key]||0;return {x:p.x,y:p.y+d}}
/* 選手は真上から見た姿で描く（フィールドが真上からの図なので、向きがそろう）。
   ローカル座標は「前＝+y」。face の方向へ回して、体と帽子のつばを向ける。 */
function facing(x,y,face){return Math.atan2(face.y-y,face.x-x)*180/Math.PI-90}

function player(x,y,color,l,scale,hl,face,up){
  const s=(scale||1)*1.22,rot=facing(x,y,face||HOME),dark=shade(color,.72),lite=shade(color,1.25);

  return `${ring}<g transform="translate(${x} ${y}) scale(${s})">
    <ellipse cx="1.2" cy="2" rx="8.5" ry="6" fill="rgba(0,0,0,.22)"/>
    <g transform="rotate(${rot})">
      <path d="M-6.5 1.5 q-2.2 3.5 -.8 6.2" stroke="#f3cfa6" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <path d="M6.5 1.5 q2 3.2 .2 6" stroke="#f3cfa6" stroke-width="2.6" stroke-linecap="round" fill="none"/>
      <ellipse cx="-7.2" cy="8.6" rx="3.3" ry="3.6" fill="#8b5a2b" stroke="#5e3a17" stroke-width=".7"/>
      <path d="M-9 7.6 l3.4 0 M-9 9.4 l3.4 0" stroke="#5e3a17" stroke-width=".5"/>
      <rect x="-8" y="-3.6" width="16" height="7.6" rx="3.8" fill="#fff"/>
      <rect x="-8" y="-3.6" width="16" height="7.6" rx="3.8" fill="none" stroke="${dark}" stroke-width=".9"/>
      <path d="M-8 -.6 h16" stroke="${color}" stroke-width="1.6"/>
      <path d="M-3.9 2.6 a4.2 3.4 0 0 0 7.8 0 z" fill="${dark}"/>

      <text y="1.6" font-size="5.6" font-weight="900" text-anchor="middle" fill="${hl?'#fff':dark}">${l}</text></g></g>`;
}
const RUN_FACE={r1:SECOND,r2:THIRD,r3:HOME,me:FIRST};
function runner(x,y,speed,id){
  const face=(S.anim.faces&&S.anim.faces[id])||RUN_FACE[id]||HOME,rot=facing(x,y,face);
  return `<g id="${id||''}" transform="translate(${x} ${y}) scale(1.2)">

      <path d="M-3.9 2.4 a4.2 3.6 0 0 0 7.8 0 z" fill="#8f1d14"/>

}
function draw(opts={}){
  const sc=scene(),sit=sc.sit;const me=sc.role;
  const foulLen=Math.hypot(110,127),fx=FENCE_R*110/foulLen,fy=FENCE_R*127/foulLen;
  let g=`<defs>
    <clipPath id="clip"><rect width="220" height="220" rx="12"/></clipPath>
    <clipPath id="fence"><circle cx="${HOME.x}" cy="${HOME.y}" r="${FENCE_R}"/></clipPath>
    <radialGradient id="mound" cx="50%" cy="38%" r="55%"><stop offset="0%" stop-color="#e8b870"/><stop offset="100%" stop-color="#c08c4a"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs><g clip-path="url(#clip)">
  <rect width="220" height="220" fill="#2f6b45"/>
  <g clip-path="url(#fence)"><circle cx="${HOME.x}" cy="${HOME.y}" r="${FENCE_R}" fill="#4aa85d"/></g>
  <circle cx="${HOME.x}" cy="${HOME.y}" r="${FENCE_R}" fill="none" stroke="#1d4d2b" stroke-width="3"/>
  <path d="M ${HOME.x} ${HOME.y+10} L ${HOME.x-84} ${HOME.y-74} A 112 112 0 0 1 ${HOME.x+84} ${HOME.y-74} Z" fill="#dca35e"/>
  <line x1="${HOME.x}" y1="${HOME.y}" x2="${HOME.x-fx}" y2="${HOME.y-fy}" stroke="#fff" stroke-width="1.4" opacity=".9"/>
  <line x1="${HOME.x}" y1="${HOME.y}" x2="${HOME.x+fx}" y2="${HOME.y-fy}" stroke="#fff" stroke-width="1.4" opacity=".9"/>
  <ellipse cx="${MOUND.x}" cy="${MOUND.y}" rx="9" ry="7.5" fill="#cf9550"/><rect x="106" y="134.5" width="8" height="3" rx=".6" fill="#fff"/>`;
  for(const p of [FIRST,SECOND,THIRD])g+=`<rect x="${p.x-5}" y="${p.y-5}" width="10" height="10" fill="#fff" transform="rotate(45 ${p.x} ${p.y})"/>`;
  g+=`<polygon points="110,188 104,182 106,177 114,177 116,182" fill="#fff"/>`;
  // 野手
  for(const key of Object.keys(POS)){
    if(sc.role==='batter'||key!==me){const p=S.anim[key]||fielderPos(key,sit);g+=player(p.x,p.y,'#1e3a8a',POS[key].l,1,false,key==='catcher'?MOUND:HOME,key==='first'||key==='third')}
  }
  if(sc.role!=='batter'){const p=S.anim[me]||fielderPos(me,sit);g+=player(p.x,p.y,'#f59e0b','4',1.15,true,S.anim.ball||HOME,me==='first'||me==='third')}
  // 走者
  const R=S.anim.runners||sit.runners;
  if(R.first)g+=runner(FIRST.x-12,FIRST.y-12,R.first,'r1');
  if(R.second)g+=runner(SECOND.x-12,SECOND.y+9,R.second,'r2');
  if(R.third)g+=runner(THIRD.x+11,THIRD.y+13,R.third,'r3');
  if(sc.role==='batter'){const p=S.anim.me||{x:HOME.x-12,y:HOME.y-4};g+=`<circle cx="${p.x}" cy="${p.y}" r="11" fill="rgba(245,158,11,.25)" stroke="#fde68a" stroke-width="1.2"/>${runner(p.x,p.y,null,'me')}`}
  for(const [id,p] of Object.entries(S.anim.extraRunners||{}))g+=runner(p.x,p.y,null,id);
  // ボール
  if(S.anim.ball)g+=`<circle cx="${S.anim.ball.x}" cy="${S.anim.ball.y}" r="3.2" fill="#fff" stroke="#c0392b" stroke-width=".8"/>`;
  if(S.anim.line)g+=`<line x1="${S.anim.line.x1}" y1="${S.anim.line.y1}" x2="${S.anim.line.x2}" y2="${S.anim.line.y2}" stroke="#fff" stroke-width="1.4" stroke-dasharray="3 2" opacity=".9"/>`;
  // タップ先
  if(opts.targets){for(const t of opts.targets){const p=SPOT[t];if(!p)continue;
    g+=`<g class="tgt" data-t="${t}" style="cursor:pointer"><circle cx="${p.x}" cy="${p.y}" r="9" fill="none" stroke="#fff" stroke-width="2" class="tgt-ring"/><circle cx="${p.x}" cy="${p.y}" r="9" fill="rgba(37,99,235,.85)" stroke="#fff" stroke-width="1.5"/><text x="${p.x}" y="${p.y+2.4}" font-size="6.5" font-weight="900" fill="#fff" text-anchor="middle">${t==='cut'?'C':'●'}</text></g>`}}
  if(S.anim.bubble){const b=S.anim.bubble;g+=`<g><rect x="${b.x-22}" y="${b.y-30}" width="44" height="13" rx="4" fill="#fff" stroke="#14213d" stroke-width=".8"/><text x="${b.x}" y="${b.y-20.5}" font-size="7" font-weight="900" text-anchor="middle" fill="#14213d">${b.t}</text></g>`}
  // スコアボード
  const sb=sit.score?`${sit.score.us+0} - ${sit.score.them+S.runs}`:`${S.runs} 失点`;
  g+=`<rect x="6" y="6" width="88" height="22" rx="6" fill="rgba(0,0,0,.65)"/>
  <text x="12" y="21.5" font-size="9" font-weight="900" fill="#fde68a">${sit.inning}回${sit.half==='オモテ'?'表':'裏'}</text>
  <text x="46" y="22.5" font-family="Bebas Neue" font-size="14" fill="#fff" letter-spacing="1">${sb}</text>
  <rect x="150" y="196" width="64" height="18" rx="6" fill="rgba(0,0,0,.65)"/><text x="156" y="208.5" font-family="Bebas Neue" font-size="10" fill="#fff">OUT</text>`;
  for(let o=0;o<3;o++)g+=`<circle cx="${184+o*10}" cy="205" r="3.6" fill="${o<S.outs?'#f2b134':'#3b3b3b'}" stroke="#777" stroke-width=".6"/>`;
  g+=`</g>`;
  field.innerHTML=g;
  if(opts.onTap)field.querySelectorAll('.tgt').forEach(el=>el.addEventListener('click',()=>opts.onTap(el.dataset.t)));
}

/* ──────────────── アニメ ──────────────── */
const sleep=(ms)=>new Promise(r=>setTimeout(r,ms));
async function tween(from,to,ms,set){const t0=performance.now();return new Promise(res=>{function f(now){const k=Math.min(1,(now-t0)/ms);const e=k<.5?2*k*k:-1+(4-2*k)*k;set({x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e});if(k<1)requestAnimationFrame(f);else res()}requestAnimationFrame(f)})}
function flash(t){const f=document.getElementById('flash');document.getElementById('flashText').textContent=t;f.classList.remove('show');void f.offsetWidth;f.classList.add('show')}

/* ──────────────── 画面 ──────────────── */
function sitRow(sit){const d=sit.score?sit.score.us-sit.score.them:null;const diff=d===null?'':d===0?'同点':d>0?`${d}点リード`:`${-d}点ビハインド`;
  const bases=['first','second','third'].filter(b=>sit.runners[b]).map(b=>({first:'一',second:'二',third:'三'}[b])).join('・');
  return `<div class="sit"><span class="tag ${scene().role==='batter'?'off':'def'}">${scene().role==='batter'?'攻撃':'守備'}</span><span class="diff">${diff}</span><span>${sit.outs}アウト</span><span>${bases?bases+'塁':'ランナーなし'}</span>${sit.defense!=='定位置'?`<span style="color:#0369a1">${sit.defense}</span>`:''}<span style="color:#6d28d9">打者：${sit.batter}</span></div>`}
function header(){document.getElementById('prog').textContent=`${S.i+1} / ${SCENES.length}`}

function showIntro(){
  S.phase='intro';S.anim={};S.plan={};S.voice=null;header();const sc=scene();draw();
  panel.innerHTML='';
  panel.append($(`<div class="card"><span class="tag src">${sc.src}</span>${sitRow(sc.sit)}<div class="note">${sc.note}</div></div>`));
  panel.append($(`<div class="card"><div class="q"><small>まだ投げる前</small>先に決めておこう</div><div class="hint">光っているところをタップ。文は読まなくていい。</div></div>`));
  const b=$(`<button class="btn">決める ›</button>`);b.onclick=()=>sc.role==='batter'?showBall():showBall();panel.append(b);
}
function planRow(){return `<div class="plan"><span class="${S.plan.ball?'on':''}">来たら：${S.plan.ball?(SPOT[S.plan.ball]?.l||BTN[S.plan.ball]):'？'}</span>${scene().not?`<span class="${S.plan.not?'on':''}">来なかったら：${S.plan.not?(SPOT[S.plan.not]?.l||BTN[S.plan.not]):'？'}</span>`:''}</div>`}
function showBall(){
  S.phase='ball';const sc=scene();const q=sc.ball;
  const spots=q.options.filter(o=>SPOT[o]),btns=q.options.filter(o=>BTN[o]);
  draw({targets:spots,onTap:(t)=>{S.plan.ball=t;sc.not?showNot():showVoice()}});
  panel.innerHTML='';
  panel.append($(`<div class="card">${planRow()}<div class="q" style="margin-top:8px"><small>${sc.role==='batter'?'打ったあと':'自分に来たら'}</small>${q.label||'どこへ投げる？'}</div><div class="hint">フィールドの●をタップ</div>
    ${btns.length?`<div class="chips" style="margin-top:8px">${btns.map(b=>`<button class="chip" data-b="${b}">${BTN[b]}</button>`).join('')}</div>`:''}</div>`));
  panel.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.plan.ball=c.dataset.b;sc.not?showNot():showVoice()});
}
function showNot(){
  S.phase='not';const sc=scene();const q=sc.not;
  const spots=q.options.filter(o=>SPOT[o]),btns=q.options.filter(o=>BTN[o]);
  draw({targets:spots,onTap:(t)=>{S.plan.not=t;showVoice()}});
  panel.innerHTML='';
  panel.append($(`<div class="card">${planRow()}<div class="q" style="margin-top:8px"><small>自分に来なかったら</small>どこへ動く？</div><div class="hint">フィールドの●をタップ</div>
    ${btns.length?`<div class="chips" style="margin-top:8px">${btns.map(b=>`<button class="chip" data-b="${b}">${BTN[b]}</button>`).join('')}</div>`:''}</div>`));
  panel.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.plan.not=c.dataset.b;showVoice()});
}
const VOICES={pitcher:['ホーム！','ファースト！','任せた！'],third:['ファースト！','サード戻る！','ホーム！'],right:['カット！','バック！','任せた！'],center:['カット！','ホーム！','セカンド！'],batter:['行く！','止まれ！','回る！']};
function showVoice(){
  S.phase='voice';const sc=scene();draw();
  panel.innerHTML='';
  const v=VOICES[sc.role]||VOICES.third;
  panel.append($(`<div class="card">${planRow()}<div class="q" style="margin-top:8px"><small>決めた。あとは声</small>なんて言う？</div><div class="chips" style="margin-top:8px">${v.map(x=>`<button class="chip" data-v="${x}">${x}</button>`).join('')}</div></div>`));
  panel.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{S.voice=c.dataset.v;play()});
}
function pick(outcomes){const tot=outcomes.reduce((a,o)=>a+o.w,0);let r=Math.random()*tot;for(const o of outcomes){r-=o.w;if(r<=0)return o}return outcomes[0]}
function nextBases(R,n){ // 走者を n 個進める（簡略）。戻り値：{runners, scored}
  let scored=0;const order=['third','second','first'];let cur={...R};
  for(let s=0;s<n;s++){if(cur.third)scored++;cur={first:null,second:cur.first,third:cur.second}}
  return {runners:cur,scored};
}
async function play(){
  S.phase='play';const sc=scene();const sit=sc.sit;const oc=pick(sc.outcomes);
  const q=oc.kind==='ball'?sc.ball:sc.not;const choice=oc.kind==='ball'?S.plan.ball:S.plan.not;
  const score=q.scores[choice]??0;
  panel.innerHTML='';panel.append($(`<div class="card"><div class="q">${oc.play}</div></div>`));
  const me=sc.role;const mePos=sc.role==='batter'?{x:HOME.x-12,y:HOME.y-4}:fielderPos(me,sit);
  if(S.voice)S.anim.bubble={x:mePos.x,y:mePos.y,t:S.voice};
  // 投球
  S.anim.ball={...MOUND};draw();await sleep(250);
  await tween(MOUND,{x:HOME.x,y:HOME.y-6},420,p=>{S.anim.ball=p;draw()});
  // 打球
  const area=AREA[oc.area]||AREA.home;
  await tween({x:HOME.x,y:HOME.y-6},area,oc.kind==='ball'&&['right','center','left'].includes(oc.area)?900:650,p=>{S.anim.ball=p;draw()});
  S.anim.bubble=null;
  // 走者スタート
  const R={...sit.runners};
  // 自分の動き
  if(sc.role==='batter'){
    await tween(mePos,{x:FIRST.x+8,y:FIRST.y+6},700,p=>{S.anim.me=p;draw()});
    // センターの送球
    await tween(area,{x:HOME.x,y:HOME.y-8},700,p=>{S.anim.ball=p;draw()});
    if(choice==='run-second'){S.anim.faces={me:SECOND};await tween({x:FIRST.x+8,y:FIRST.y+6},{x:SECOND.x+12,y:SECOND.y+8},700,p=>{S.anim.me=p;draw()});flash('セーフ！')}
    else if(choice==='round-first'){await tween({x:FIRST.x+8,y:FIRST.y+6},{x:FIRST.x+10,y:FIRST.y+4},400,p=>{S.anim.me=p;draw()});flash('一塁')}
    else{flash('止まった')}
  } else {
    const fast=score===3;
    if(oc.kind==='ball'){
      await tween(mePos,area,fast?350:600,p=>{S.anim[me]=p;draw()});
      if(choice==='hold'){await sleep(700)}
      else if(choice==='chase'||choice==='tag'){await tween(area,{x:area.x+14,y:area.y-12},600,p=>{S.anim[me]=p;S.anim.ball=p;draw()})}
      else if(choice==='stepthird'){await tween(area,THIRD,400,p=>{S.anim[me]=p;S.anim.ball=p;draw()})}
      else {const to=SPOT[choice];await sleep(fast?80:420);S.anim.line={x1:area.x,y1:area.y,x2:to.x,y2:to.y};await tween(area,to,fast?380:520,p=>{S.anim.ball=p;draw()});S.anim.line=null}
    } else {
      const to=choice==='stay'?mePos:choice==='chase'?area:SPOT[choice];
      await tween(mePos,to,fast?450:700,p=>{S.anim[me]=p;draw()});
      // 自分以外が処理した打球は、一塁へ送球される（そらした球・ファウルは除く）
      if(!oc.noOut){S.anim.line={x1:area.x,y1:area.y,x2:FIRST.x,y2:FIRST.y};await tween(area,FIRST,480,p=>{S.anim.ball=p;draw()});S.anim.line=null}
      await sleep(300);
    }
    // 結果の走者処理
    let outsAdd=0,adv=0,msg='';
    if(score===3){outsAdd=1;adv=0;msg='アウト！'}
    else if(score===1){adv=1;msg='セーフ…'}
    else if(score===0){adv=1;msg='間に合わない'}
    else {adv=2;msg='やられた！'}
    if(oc.kind==='not'&&score===3&&oc.noOut){outsAdd=0;msg='止めた！'}
    const nb=nextBases(R,adv);
    if(adv>0){const moves=[];if(R.third)moves.push({id:'r3',from:{x:THIRD.x+11,y:THIRD.y+13},to:{x:HOME.x-6,y:HOME.y-2}});if(R.second)moves.push({id:'r2',from:{x:SECOND.x-12,y:SECOND.y+9},to:adv>=2?{x:HOME.x+6,y:HOME.y-2}:{x:THIRD.x+11,y:THIRD.y+13}});if(R.first)moves.push({id:'r1',from:{x:FIRST.x-12,y:FIRST.y-12},to:adv>=2?{x:THIRD.x+11,y:THIRD.y+13}:{x:SECOND.x-12,y:SECOND.y+9}});
      S.anim.runners={first:null,second:null,third:null};S.anim.extraRunners={};S.anim.faces={};for(const m of moves){S.anim.extraRunners[m.id]=m.from;S.anim.faces[m.id]=m.to}
      await Promise.all(moves.map(m=>tween(m.from,m.to,700,p=>{S.anim.extraRunners[m.id]=p;draw()})));
    }
    flash(msg);
    S.outs+=outsAdd;S.runs+=nb.scored;
  }
  await sleep(900);
  S.log.push({id:sc.id,score,kind:oc.kind,choice,key:sc.key});
  showResult(oc,q,choice,score);
}
const TIER={3:['best','最善手！'],1:['ok','まあOK'],0:['poor','もったいない'],'-1':['fatal','試合が壊れる']};
function showResult(oc,q,choice,score){
  S.phase='result';const sc=scene();const [cls,label]=TIER[score];draw();
  panel.innerHTML='';
  panel.append($(`<div class="result ${cls}">${label}</div>`));
  panel.append($(`<div class="key"><small>おぼえること</small>${sc.key}</div>`));
  panel.append($(`<div class="card"><div class="why"><b>${SPOT[choice]?.l||BTN[choice]||choice}</b>：${q.fb[choice]||''}</div>
    <details style="margin-top:8px"><summary>くわしく</summary><div class="why" style="margin-top:6px">${sc.why}</div>
    <div class="why" style="margin-top:6px">${q.options.map(o=>`<div>・<b>${SPOT[o]?.l||BTN[o]||o}</b>（${q.scores[o]>0?'+':''}${q.scores[o]}）${q.fb[o]||''}</div>`).join('')}</div></details></div>`));
  const done=S.outs>=3||S.i>=SCENES.length-1;
  const b=$(`<button class="btn blue">${done?'このイニングの結果 ›':'次の打者 ›'}</button>`);
  b.onclick=()=>{if(done)showSummary();else{S.i++;showIntro()}};panel.append(b);
}
function showSummary(){
  S.phase='summary';draw();panel.innerHTML='';
  const best=S.log.filter(l=>l.score===3).length;
  panel.append($(`<div class="card" style="text-align:center"><div class="hint">このイニング</div><div class="big">失点 ${S.runs}</div><div style="font-weight:900;margin-top:4px">${S.outs>=3?'守り切った！':'打者が終わった'}　最善手 ${best} / ${S.log.length}</div></div>`));
  panel.append($(`<div class="card"><div class="log">${S.log.map(l=>`<div><b style="color:${{3:'#15803d',1:'#0369a1',0:'#b45309','-1':'#b91c1c'}[l.score]}">${{3:'◎',1:'○',0:'△','-1':'✕'}[l.score]}</b><span>${l.key}</span></div>`).join('')}</div></div>`));
  const b=$(`<button class="btn">もう1イニング ›</button>`);b.onclick=()=>{S.i=0;S.outs=0;S.runs=0;S.log=[];shuffle();showIntro()};panel.append(b);
}
function shuffle(){for(let i=SCENES.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[SCENES[i],SCENES[j]]=[SCENES[j],SCENES[i]]}
  // 双子は a→b の順を保つ
  const b=SCENES.splice(SCENES.findIndex(s=>s.id==='twin-third-b'),1)[0];
  SCENES.splice(SCENES.findIndex(s=>s.id==='twin-third-a')+1,0,b)}
shuffle();showIntro();
</script>
